name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: factorypilot-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-quality:
    name: Backend Quality
    runs-on: ubuntu-latest
    env:
      FACTORYPILOT_ENVIRONMENT: test
      FACTORYPILOT_LOG_JSON: 'false'
      FACTORYPILOT_HEALTHCHECK_DATABASE: 'false'
      FACTORYPILOT_HEALTHCHECK_REDIS: 'false'
      FACTORYPILOT_DATABASE_URL: postgresql+asyncpg://factorypilot:factorypilot@127.0.0.1:5432/factorypilot
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg18
        env:
          POSTGRES_USER: factorypilot
          POSTGRES_PASSWORD: factorypilot
          POSTGRES_DB: factorypilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U factorypilot -d factorypilot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Install backend dependencies
        run: uv sync

      - name: Ruff
        run: uv run ruff check .

      - name: mypy
        run: uv run mypy app

      - name: Apply database migrations
        run: uv run alembic upgrade head

      - name: pytest
        run: uv run pytest

  frontend-quality:
    name: Frontend Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.17.1 --activate

      - name: Install frontend dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Biome lint
        run: pnpm lint:web

      - name: TypeScript typecheck
        run: pnpm typecheck:web

      - name: Vitest
        run: pnpm test:web

      - name: Production build
        run: pnpm build:web

  compose-validation:
    name: Compose Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Docker Compose
        run: docker compose config --quiet
