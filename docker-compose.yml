services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg18
    container_name: factorypilot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-factorypilot}
      POSTGRES_USER: ${POSTGRES_USER:-factorypilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-factorypilot}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - factorypilot_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-factorypilot} -d ${POSTGRES_DB:-factorypilot}",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - factorypilot

  redis:
    image: redis:8.10-alpine
    container_name: factorypilot-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - factorypilot_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - factorypilot

volumes:
  factorypilot_postgres_data:
  factorypilot_redis_data:

networks:
  factorypilot:
    name: factorypilot-network
