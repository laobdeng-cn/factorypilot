services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg18
    container_name: factorypilot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-factorypilot}
      POSTGRES_USER: ${POSTGRES_USER:-factorypilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-factorypilot}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    volumes:
      - factorypilot_postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-factorypilot} -d ${POSTGRES_DB:-factorypilot}",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - factorypilot

  redis:
    image: redis:8.10-alpine
    container_name: factorypilot-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-56379}:6379"
    volumes:
      - factorypilot_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - factorypilot

  backend:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: factorypilot-api
    restart: unless-stopped
    environment:
      FACTORYPILOT_ENVIRONMENT: development
      FACTORYPILOT_DEBUG: "false"
      FACTORYPILOT_LOG_LEVEL: INFO
      FACTORYPILOT_LOG_JSON: "false"
      FACTORYPILOT_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-factorypilot}:${POSTGRES_PASSWORD:-factorypilot}@postgres:5432/${POSTGRES_DB:-factorypilot}
      FACTORYPILOT_REDIS_URL: redis://redis:6379/0
      FACTORYPILOT_CORS_ORIGINS: '["http://localhost:${WEB_PORT:-8001}","http://127.0.0.1:${WEB_PORT:-8001}"]'
      FACTORYPILOT_HEALTHCHECK_DATABASE: "true"
      FACTORYPILOT_HEALTHCHECK_REDIS: "true"
      FACTORYPILOT_DATABASE_POOL_SIZE: "5"
      FACTORYPILOT_DATABASE_MAX_OVERFLOW: "10"
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=2)",
        ]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s
    networks:
      - factorypilot

  frontend:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: factorypilot-web
    restart: unless-stopped
    environment:
      PORT: "8001"
      HOST: 0.0.0.0
      FACTORYPILOT_API_PROXY_TARGET: http://backend:8000
    ports:
      - "${WEB_PORT:-8001}:8001"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8001').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s
    networks:
      - factorypilot

volumes:
  factorypilot_postgres_data:
  factorypilot_redis_data:

networks:
  factorypilot:
    name: factorypilot-network
